# SoulX-Singer deploy: single-stage flow-matching DiT (SVS or SVC).
# Pick the pipeline via --model-class-name SoulXSingerPipeline | SoulXSingerSVCPipeline
# and point MODEL at the SVS or SVC view directory (see examples hub).

async_chunk: false
# Upstream SoulX-Singer uses FP16 trunk; BF16 default costs ~12% on Ada-class GPUs (5880/4090).
# Override to bfloat16 on datacenter GPUs if you prefer numerical headroom over peak FP16 throughput.
dtype: float16

stage_args:
  - stage_id: 0
    stage_type: diffusion
    runtime:
      devices: "0"
    engine_args:
      model_stage: diffusion
      max_num_seqs: 1
      gpu_memory_utilization: 0.5
      enforce_eager: false
      trust_remote_code: true
      distributed_executor_backend: "mp"
    default_sampling_params:
      num_inference_steps: 32
      guidance_scale: 3.0
      seed: 42
    final_output: true
    final_output_type: audio
